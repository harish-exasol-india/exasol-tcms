upstream backend {
    server backend:3000;
}

server {
    listen 8080;
    server_name _;

    # nginx defaults to 1MB, which is below both the attachment limit (25MB) and the
    # ingest body limit (32MB). Without this, a large screenshot or a big JUnit report is
    # rejected here with an opaque HTML 413 that never reaches the application, so the
    # caller sees neither the real limit nor a parseable error.
    client_max_body_size 33m;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API: the session cookie is httpOnly and SameSite=Lax, so proxying rather
    # than calling the backend cross-origin keeps it attached without CORS exceptions.
    location /api/ {
        proxy_pass http://backend;
        # Let the application produce its own JSON error for an oversized body rather than
        # nginx emitting an HTML page a JSON client cannot read.
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /mcp {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA: unmatched paths fall through to the client router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
